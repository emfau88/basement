<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9d4c9">
<title>EMFAU — Virtual Studio v11</title>
<meta name="description" content="EMFAU Virtual Studio — a bright interactive developer studio for games, web and experiments.">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --ink:#171b1a;
  --cream:#f2efe7;
  --muted:#6f7672;
  --line:rgba(23,27,26,.14);
  --glass:rgba(247,245,239,.76);
  --sage:#8da890;
  --terracotta:#c88462;
  --blue:#78a8b9;
  --ease:cubic-bezier(.16,.84,.26,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d8d3c7;color:var(--ink);font-family:Inter,Arial,sans-serif}
body{letter-spacing:-.015em;user-select:none}
canvas{display:block;width:100%;height:100%;outline:none}
button{font:inherit}
#app{position:fixed;inset:0;background:#d8d3c7}

/* cinematic but bright overlays */
.vignette,.grain,.sunwash,.fade{position:fixed;inset:0;pointer-events:none}
.vignette{
  z-index:5;
  background:
    radial-gradient(ellipse at 50% 47%,transparent 55%,rgba(59,52,42,.028) 80%,rgba(39,34,28,.09) 125%),
    linear-gradient(to bottom,rgba(255,255,255,.05),transparent 22%,transparent 76%,rgba(58,48,39,.05));
  box-shadow:inset 0 0 100px rgba(62,54,44,.055)
}
.sunwash{
  z-index:4;
  background:linear-gradient(115deg,rgba(255,244,215,.040),transparent 38%,transparent 100%);
  mix-blend-mode:screen
}
.grain{
  z-index:6;opacity:.010;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")
}
.fade{z-index:9;background:#f1ede4;opacity:0;transition:opacity .16s ease}

/* UI */
.top{
  position:fixed;z-index:20;top:max(18px,env(safe-area-inset-top));left:22px;right:22px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none
}
.logo{
  justify-self:start;font-size:17px;font-weight:900;letter-spacing:-.07em;
  padding:7px 9px 6px;border:1px solid rgba(20,24,23,.22);border-radius:8px;
  background:rgba(248,246,240,.72);backdrop-filter:blur(11px);
  box-shadow:0 8px 24px rgba(52,44,37,.08)
}
.manifesto{
  justify-self:center;text-align:center;text-transform:uppercase;font-size:9px;font-weight:700;
  line-height:1.45;letter-spacing:.20em;color:rgba(20,25,23,.78)
}
.live{
  justify-self:end;font-size:8px;letter-spacing:.17em;text-transform:uppercase;
  color:rgba(24,29,27,.50);padding-top:8px
}
.live:before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:7px;
  background:#7a9b80;box-shadow:0 0 10px rgba(122,155,128,.48)
}

.intro{
  position:fixed;z-index:13;left:24px;top:78px;
  width:min(330px,30vw);pointer-events:none;
  padding:16px 18px 17px;
  border:1px solid rgba(24,29,27,.14);
  border-radius:14px;
  background:rgba(247,244,236,.94);
  box-shadow:0 14px 36px rgba(58,48,40,.12), inset 0 1px rgba(255,255,255,.72);
  backdrop-filter:none;
  transition:opacity .35s ease,transform .7s var(--ease)
}
body.focus .intro{opacity:0;transform:translateX(-18px)}
.kicker{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:#6d8371;margin-bottom:9px;text-shadow:none}
.intro h1{
  margin:0;font-size:clamp(31px,3.2vw,46px);font-weight:860;line-height:.92;letter-spacing:-.064em;
  color:#151918;
  -webkit-text-stroke:0;
  text-shadow:none
}
.intro p{
  max-width:31ch;margin:11px 0 0;color:#5f6864;font-size:10.5px;line-height:1.55;
  text-shadow:none
}

/* info */
.info{
  position:fixed;z-index:21;right:25px;top:50%;width:min(360px,calc(100vw - 34px));
  transform:translateY(-50%) translateX(26px);opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .55s var(--ease)
}
body.focus .info{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.card{
  position:relative;padding:21px;border:1px solid rgba(25,30,28,.13);border-radius:17px;
  background:linear-gradient(180deg,rgba(249,247,241,.82),rgba(240,236,227,.78));
  backdrop-filter:blur(20px) saturate(1.08);
  box-shadow:0 26px 70px rgba(72,59,47,.13),inset 0 1px rgba(255,255,255,.62)
}
.card .eyebrow{font-size:8px;letter-spacing:.21em;text-transform:uppercase;color:#6f8c74;margin-bottom:11px}
.card h2{font-size:30px;line-height:.96;letter-spacing:-.055em;margin:0 0 12px;color:#171b1a}
.card p{margin:0 0 17px;color:#69716d;font-size:11px;line-height:1.6}
.rows{display:grid;gap:6px}
.row{
  display:flex;justify-content:space-between;align-items:center;padding:11px;
  border:1px solid rgba(26,31,29,.075);border-radius:10px;background:rgba(255,255,255,.38)
}
.row b{font-size:8px;letter-spacing:.1em;text-transform:uppercase}.row span{font-size:9px;color:#7d837f}
.close{
  position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;
  background:transparent;color:#7c837f;font-size:19px;cursor:pointer
}
.close:hover{background:rgba(20,25,23,.05);color:#171b1a}

/* Contextual HUD composition */

/* Web: keep information away from the two screens. */
body.view-web .info{
  left:24px;right:auto;top:86px;width:min(270px,calc(100vw - 34px));
  transform:translateY(-12px)
}
body.focus.view-web .info{transform:translateY(0)}
body.view-web .card{padding:15px 17px 16px}
body.view-web .card h2{font-size:23px;margin-bottom:8px}
body.view-web .card p{margin-bottom:0;line-height:1.48}
body.view-web .rows{display:none}

/* Projects: a deliberately tiny gallery label in the EMPTY CENTER between the four cards. */
body.view-projects .info{
  left:50%;right:auto;top:50%;width:176px;
  transform:translate(-50%,-50%) scale(.965)
}
body.focus.view-projects .info{transform:translate(-50%,-50%) scale(1)}
body.view-projects .card{
  padding:11px 13px 12px;border-radius:12px;
  background:rgba(247,245,239,.90);
  backdrop-filter:blur(12px) saturate(1.04);
  box-shadow:0 13px 34px rgba(64,53,44,.10),inset 0 1px rgba(255,255,255,.65)
}
body.view-projects .card .eyebrow{font-size:7px;margin-bottom:6px}
body.view-projects .card h2{font-size:16px;line-height:1;margin:0;padding-right:20px}
body.view-projects .card p,
body.view-projects .rows{display:none}
body.view-projects .close{width:26px;height:26px;right:5px;top:5px;font-size:16px}

body.inspect-selector .info{opacity:0!important;pointer-events:none!important}
.inspect-back{
  position:fixed;z-index:28;left:24px;top:78px;
  border:1px solid rgba(26,31,29,.13);border-radius:11px;
  padding:10px 13px;background:rgba(248,246,240,.88);
  backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(63,52,43,.10);
  color:#313835;font:700 9px/1 Arial;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .22s ease,transform .3s var(--ease)
}
body.inspect-selector .inspect-back{opacity:1;transform:translateY(0);pointer-events:auto}
.inspect-back:hover{background:#fbfaf6;color:#151918}

/* nav */
.navwrap{
  position:fixed;z-index:25;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  width:min(700px,calc(100vw - 30px));transform:translateX(-50%)
}
.nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;
  border:1px solid rgba(26,31,29,.14);border-radius:16px;
  background:rgba(248,246,240,.76);backdrop-filter:blur(19px) saturate(1.12);
  box-shadow:0 18px 50px rgba(70,58,47,.13),inset 0 1px rgba(255,255,255,.6)
}
.nav button{
  border:0;border-radius:11px;background:transparent;color:#747c78;padding:10px 7px 9px;cursor:pointer;
  transition:background .18s,color .18s,transform .18s
}
.nav button:hover{color:#1a201e;background:rgba(35,43,39,.055)}
.nav button:active{transform:scale(.98)}
.nav button.active{background:#1a1f1d;color:#f4f1e9;box-shadow:0 5px 16px rgba(40,34,29,.11)}
.nav .n{display:block;margin-bottom:5px;font:500 7px/1 ui-monospace,monospace;opacity:.55;letter-spacing:.08em}
.nav .t{display:block;font-size:8px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}

.tooltip{
  position:fixed;z-index:31;pointer-events:none;opacity:0;
  transform:translate(-50%,-115%) translateY(6px);padding:7px 9px;
  border:1px solid rgba(27,32,30,.13);border-radius:8px;background:rgba(248,246,240,.88);
  backdrop-filter:blur(12px);color:#1a1f1d;font-size:8px;font-weight:750;letter-spacing:.12em;
  text-transform:uppercase;white-space:nowrap;transition:opacity .12s ease,transform .12s ease;
  box-shadow:0 8px 25px rgba(55,46,38,.12)
}
.tooltip.show{opacity:1;transform:translate(-50%,-115%) translateY(0)}
.helper{
  position:fixed;z-index:12;left:25px;bottom:28px;pointer-events:none;
  font-size:7px;letter-spacing:.16em;text-transform:uppercase;color:rgba(24,29,27,.38)
}
.sound{
  position:fixed;z-index:25;right:22px;bottom:22px;border:1px solid rgba(26,31,29,.14);
  background:rgba(248,246,240,.74);color:#7b827e;border-radius:10px;padding:8px 10px;
  cursor:pointer;font-size:8px;letter-spacing:.13em;text-transform:uppercase;backdrop-filter:blur(14px)
}

.sound.on{color:#1b211f}.sound:hover{color:#111513}

/* project detail overlay */
.project-backdrop{
  position:fixed;inset:0;z-index:34;background:rgba(24,23,20,.20);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .22s ease
}
.project-panel{
  position:fixed;z-index:35;left:50%;top:50%;
  width:min(900px,calc(100vw - 28px));opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.985);transition:opacity .22s ease,transform .22s ease
}
body.project-open .project-backdrop{opacity:1;pointer-events:auto}
body.project-open .project-panel{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.project-shell{
  display:grid;grid-template-columns:minmax(280px,1.05fr) minmax(280px,.95fr);
  border:1px solid rgba(26,31,29,.14);border-radius:18px;overflow:hidden;
  background:rgba(247,244,236,.98);box-shadow:0 28px 85px rgba(68,56,45,.18), inset 0 1px rgba(255,255,255,.72)
}
.project-media{position:relative;min-height:320px;background:#ddd7cc}
.project-media img{display:block;width:100%;height:100%;object-fit:cover}
.project-copy{position:relative;padding:24px 24px 22px}
.project-tag{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:#6d8371;margin-bottom:10px}
.project-copy h3{margin:0;font-size:30px;line-height:.95;letter-spacing:-.055em;color:#151918}
.project-copy p{margin:12px 0 15px;font-size:12px;line-height:1.58;color:#64706a}
.project-meta{display:grid;gap:7px}
.project-meta .mrow{display:flex;justify-content:space-between;gap:14px;padding:10px 11px;border:1px solid rgba(26,31,29,.08);border-radius:10px;background:rgba(255,255,255,.42)}
.project-meta .mrow b{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#222826}
.project-meta .mrow span{font-size:10px;color:#6f7772;text-align:right}
.project-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.project-actions a,.project-actions button{
  appearance:none;border:1px solid rgba(26,31,29,.14);border-radius:10px;
  background:#1a1f1d;color:#f4f1e9;text-decoration:none;padding:10px 13px;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;cursor:pointer
}
.project-actions a.secondary,.project-actions button.secondary{
  background:rgba(255,255,255,.45);color:#1a1f1d
}
.project-close{
  position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;
  background:rgba(255,255,255,.56);color:#5d6661;font-size:22px;cursor:pointer;
  box-shadow:0 8px 18px rgba(37,29,23,.08)
}
.project-close:hover{background:white;color:#131816}

@media(max-width:760px){
  .project-shell{grid-template-columns:1fr}
  .project-media{min-height:210px}
  .project-copy{padding:18px 18px 17px}
  .project-copy h3{font-size:25px}
}
/* loader */
.loader{
  position:fixed;inset:0;z-index:100;background:#ece7db;display:grid;place-items:center;
  transition:opacity .55s ease,visibility .55s ease
}
.loader.done{opacity:0;visibility:hidden}
.loadinner{width:min(360px,74vw)}
.loadtop{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.loadmark{font-size:19px;font-weight:900;letter-spacing:-.07em}
.loadlabel{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#7b807d}
.loadbar{height:1px;background:#cbc6bb;overflow:hidden}.loadbar i{display:block;width:0;height:100%;background:#212624;transition:width .35s ease}

@media(max-width:760px){
  .top{left:15px;right:15px}.manifesto,.live,.helper,.sound{display:none}
  .intro{left:12px;top:58px;width:min(340px,86vw);padding:14px 16px 15px}.intro h1{font-size:42px}
  .info{left:12px;right:12px;top:auto;bottom:82px;width:auto;transform:translateY(18px)}
  body.focus .info{transform:translateY(0)}
  .card{padding:16px}.card h2{font-size:24px}
  .card p{font-size:11px;line-height:1.55}
  .row{padding:11px 0}
  .nav{left:10px;right:10px;bottom:12px;padding:8px}
  .nav button{padding:11px 4px 10px}.nav .t{font-size:7px}
  body.view-web .info{left:12px;right:12px;top:58px;width:auto;transform:translateY(-8px)}
  body.focus.view-web .info{transform:translateY(0)}
  body.view-web .rows{display:none}
  body.view-projects .info{left:50%;right:auto;top:50%;bottom:auto;width:158px;transform:translate(-50%,-50%) scale(.965)}
  body.focus.view-projects .info{transform:translate(-50%,-50%) scale(1)}
  body.view-projects .rows{display:none}
  .inspect-back{left:12px;top:58px;padding:10px 12px}
  body.inspect-selector .navwrap{opacity:.42;transition:opacity .2s ease}
}
@media(prefers-reduced-motion:reduce){.intro,.info{transition:none!important}}
</style>
</head>

<body>
<div id="app"></div>
<div class="sunwash"></div><div class="vignette"></div><div class="grain"></div><div class="fade" id="fade"></div>

<div class="loader" id="loader">
  <div class="loadinner">
    <div class="loadtop"><div class="loadmark">emfau</div><div class="loadlabel" id="loadlabel">opening studio</div></div>
    <div class="loadbar"><i id="loadbar"></i></div>
  </div>
</div>

<header class="top">
  <div class="logo">emfau</div>
  <div class="manifesto">A bright digital workshop for<br>games, web & experiments</div>
  <div class="live">Studio online</div>
</header>

<section class="intro">
  <div class="kicker">Virtual Studio / v11</div>
  <h1>ENTER THE<br>STUDIO.</h1>
  <p>Inspectable screens, context-aware HUD placement and calibrated project displays.</p>
</section>

<aside class="info">
  <div class="card">
    <button class="close" id="close">×</button>
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p id="copy"></p>
    <div class="rows" id="rows"></div>
  </div>
</aside>

<div class="tooltip" id="tooltip"></div>
<div class="helper">Click work areas · ESC returns</div>
<button class="sound" id="sound">Sound off</button>
<button class="inspect-back" id="inspectBack">← Games overview</button>

<div class="project-backdrop" id="projectBackdrop"></div>
<aside class="project-panel" id="projectPanel" aria-hidden="true">
  <div class="project-shell">
    <div class="project-media">
      <img id="projectImage" alt="">
      <button class="project-close" id="projectClose" aria-label="Close">×</button>
    </div>
    <div class="project-copy">
      <div class="project-tag" id="projectTag">Featured Project</div>
      <h3 id="projectTitle"></h3>
      <p id="projectSummary"></p>
      <div class="project-meta" id="projectMeta"></div>
      <div class="project-actions" id="projectActions"></div>
    </div>
  </div>
</aside>

<div class="navwrap">
  <nav class="nav">
    <button class="active" data-view="studio"><span class="n">00</span><span class="t">Studio</span></button>
    <button data-view="games"><span class="n">01</span><span class="t">Games</span></button>
    <button data-view="web"><span class="n">02</span><span class="t">Web</span></button>
    <button data-view="projects"><span class="n">03</span><span class="t">Projects</span></button>
    <button data-view="archive"><span class="n">04</span><span class="t">Archive</span></button>
  </nav>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();

const appEl=document.getElementById('app'),loader=document.getElementById('loader'),
loadbar=document.getElementById('loadbar'),loadlabel=document.getElementById('loadlabel'),
tooltip=document.getElementById('tooltip'),fade=document.getElementById('fade');

loadbar.style.width='18%';

/* renderer */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.94;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;
renderer.shadowMap.needsUpdate=true;
appEl.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd7d3c9);
scene.fog=new THREE.Fog(0xd7d3c9,15,31);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,90);
scene.add(camera);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.24,.34,.85);
bloom.threshold=.84;bloom.strength=.15;bloom.radius=.26;
composer.addPass(bloom);composer.addPass(new OutputPass());

loadbar.style.width='36%';

/* palette */
const M={
  white:new THREE.MeshStandardMaterial({color:0xe7e3da,roughness:.78,metalness:.02}),
  white2:new THREE.MeshStandardMaterial({color:0xd9d6ce,roughness:.82,metalness:.02}),
  plaster:new THREE.MeshStandardMaterial({color:0xcfcac0,roughness:.91,metalness:.0}),
  graphite:new THREE.MeshStandardMaterial({color:0x2b302e,roughness:.48,metalness:.38}),
  graphite2:new THREE.MeshStandardMaterial({color:0x414744,roughness:.42,metalness:.45}),
  oak:new THREE.MeshStandardMaterial({color:0x9b7454,roughness:.62,metalness:.02}),
  oakLight:new THREE.MeshStandardMaterial({color:0xb98d67,roughness:.67,metalness:.02}),
  floor:new THREE.MeshPhysicalMaterial({color:0xb89d7c,roughness:.62,metalness:.03,clearcoat:.08,clearcoatRoughness:.8}),
  rug:new THREE.MeshStandardMaterial({color:0xb9b7ad,roughness:.96,metalness:0}),
  sage:new THREE.MeshStandardMaterial({color:0x849e87,roughness:.68,metalness:.01}),
  terracotta:new THREE.MeshStandardMaterial({color:0xbd7656,roughness:.68,metalness:.01}),
  blue:new THREE.MeshStandardMaterial({color:0x729dad,roughness:.58,metalness:.04}),
  brass:new THREE.MeshStandardMaterial({color:0xa4834d,roughness:.35,metalness:.72}),
  black:new THREE.MeshStandardMaterial({color:0x171a19,roughness:.5,metalness:.4}),
  glass:new THREE.MeshPhysicalMaterial({color:0xc8d8d9,transparent:true,opacity:.20,roughness:.05,metalness:.0,transmission:.32,thickness:.08}),
  leaf:new THREE.MeshStandardMaterial({color:0x55745a,roughness:.82,metalness:0}),
  leaf2:new THREE.MeshStandardMaterial({color:0x6f8c72,roughness:.8,metalness:0})
};

function box(name,size,pos,mat=M.white,rot=[0,0,0],cast=true,receive=true,rounded=0){
  const g=rounded>0?new RoundedBoxGeometry(size[0],size[1],size[2],5,rounded):new THREE.BoxGeometry(...size);
  const m=new THREE.Mesh(g,mat);m.name=name;m.position.set(...pos);m.rotation.set(...rot);
  m.castShadow=cast;m.receiveShadow=receive;scene.add(m);return m
}
function grp(name,pos=[0,0,0],rot=[0,0,0]){
  const g=new THREE.Group();g.name=name;g.position.set(...pos);g.rotation.set(...rot);scene.add(g);return g
}
function addBox(parent,size,pos,mat=M.white,rot=[0,0,0],rounded=0){
  const g=rounded>0?new RoundedBoxGeometry(size[0],size[1],size[2],5,rounded):new THREE.BoxGeometry(...size);
  const m=new THREE.Mesh(g,mat);m.position.set(...pos);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m
}
function addCyl(parent,r1,r2,h,pos,mat=M.graphite,rot=[0,0,0],seg=24){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat);m.position.set(...pos);m.rotation.set(...rot);

function point(color,intensity,distance,pos){

}
function tube(points,radius,mat,segments=40){

  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,radius,8,false),mat);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh

function calibratedCoverCrop(ctx,item,x,y,w,h,zoom=1,panX=.5,panY=.5,alpha=1){

function liveCanvas(){
  const canvas=document.createElement('canvas');
  canvas.width=768;canvas.height=432;
  const ctx=canvas.getContext('2d');
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=4;
  return {canvas,ctx,texture};
}
function attachLiveTexture(mesh,live,emissive=.72){
  const mat=new THREE.MeshStandardMaterial({
    map:live.texture,emissiveMap:live.texture,emissive:0xffffff,
    emissiveIntensity:emissive,roughness:.25,metalness:.02
  });
  mesh.material=mat;
  mesh.material.needsUpdate=true;
}
function loadRemoteImage(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('Image load failed: '+url));
    img.src=url;
  });
}
async function loadItems(items){
  const out=[];
  for(const item of items){
    try{out.push({...item,img:await loadRemoteImage(item.url)})}
    catch(err){console.warn('[screen asset]',err.message)}
  }
  return out;
}
function coverCrop(ctx,img,x,y,w,h,zoom=1,panX=.5,panY=.5,alpha=1){
  if(!img)return;
  const ir=img.width/img.height, rr=w/h;
  let sw,sh;
  if(ir>rr){sh=img.height/zoom;sw=sh*rr}
  else{sw=img.width/zoom;sh=sw/rr}
  const sx=Math.max(0,Math.min(img.width-sw,(img.width-sw)*panX));
  const sy=Math.max(0,Math.min(img.height-sh,(img.height-sh)*panY));
  ctx.save();ctx.globalAlpha=alpha;
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function screenBase(ctx,bg='#0e1211'){
  ctx.fillStyle=bg;ctx.fillRect(0,0,768,432);
}
function topChrome(ctx,label,accent='#9bb37d'){
  ctx.fillStyle='rgba(7,10,9,.80)';ctx.fillRect(0,0,768,48);
  ctx.fillStyle=accent;ctx.font='700 15px Arial';ctx.fillText('EMFAU // '+label.toUpperCase(),26,30);
  ctx.fillStyle='rgba(255,255,255,.40)';ctx.font='500 12px monospace';ctx.fillText('LIVE',704,29);
}

function drawGames(d,ms){
  const {ctx,texture}=d.live;screenBase(ctx);
  if(!d.items.length){topChrome(ctx,'GAMES');ctx.fillStyle='#e9eee7';ctx.font='700 34px Arial';ctx.fillText('LOADING PROJECTS',36,218);texture.needsUpdate=true;return}

  let item=null, fade=0;
  if(current==='games'){
    item=findProjectByKey(d.items,selectedGameKey)||d.items[0];
  }else{
    const interval=6200;
    const raw=(ms/interval)%d.items.length;
    const idx=Math.floor(raw), frac=raw-idx,next=(idx+1)%d.items.length;
    fade=Math.max(0,Math.min(1,(frac-.84)/.16));
    calibratedCoverCrop(ctx,d.items[idx],0,48,768,384,1.04,.5,.46+Math.sin(ms*.00016)*.08,1);
    if(fade>0)calibratedCoverCrop(ctx,d.items[next],0,48,768,384,1.04,.5,.50,fade);
    item=fade>.5?d.items[next]:d.items[idx];
  }

  if(current==='games'){
    const pan=.44+Math.sin(ms*.00022)*.05;
    calibratedCoverCrop(ctx,item,0,48,768,384,1.06,.50,pan,1);
  }

  d.currentKey=item.key;
  const grad=ctx.createLinearGradient(0,240,0,432);grad.addColorStop(0,'rgba(5,8,7,0)');grad.addColorStop(1,'rgba(5,8,7,.92)');
  ctx.fillStyle=grad;ctx.fillRect(0,220,768,212);

function updateLiveScreens(ms){
  for(const d of liveScreens){
    if(ms-d.last<90)continue; // ~11 fps: enough for monitors, cheap for GPU/CPU
    d.last=ms;
    if(d.type==='games')drawGames(d,ms);
    else if(d.type==='gamepan')drawGamePan(d,ms);
    else if(d.type==='terminal')drawTerminal(d,ms);
    else if(d.type==='apps')drawApps(d,ms);
    else if(d.type==='appticker')drawAppTicker(d,ms);
    else if(d.type==='archive')drawArchive(d,ms)
  }
}
function plant(pos,scale=1){
  const g=grp('Plant',pos);
  addCyl(g,.26*scale,.33*scale,.48*scale,[0,.24*scale,0],M.terracotta,[0,0,0],28);
  const stemMat=new THREE.MeshStandardMaterial({color:0x53684f,roughness:.9});
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const sx=Math.cos(a)*.12*scale, sz=Math.sin(a)*.12*scale;
    addCyl(g,.018*scale,.026*scale,.9*scale,[sx,.78*scale,sz],stemMat,[0,0,-Math.cos(a)*.18],12);
    for(let j=0;j<3;j++){
      const leaf=new THREE.Mesh(new THREE.SphereGeometry(.18*scale,18,12),j%2?M.leaf:M.leaf2);
      leaf.scale.set(1.6,.52,.62);leaf.position.set(sx+Math.cos(a+j*.8)*.18*scale,.62*scale+j*.23*scale,sz+Math.sin(a+j*.8)*.18*scale);
      leaf.rotation.y=a+j*.7;leaf.castShadow=true;g.add(leaf);
    }
  }
  return g
}

function dustTexture(){

  const g=x.createRadialGradient(32,32,0,32,32,30);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)
}

for(let i=0;i<dustCount;i++){dustPos[i*3]=-6.8+Math.random()*13.6;dustPos[i*3+1]=.5+Math.random()*4.3;dustPos[i*3+2]=-5.8+Math.random()*8.6}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));

function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function setView(name){
  const preset=getPreset(name);
  if(!preset)return;
  setProjectCardHover(null);
  if(name===current && !inspectMode)return;
  if(inspectMode){
    inspectMode=null;
    document.body.classList.remove('inspect-selector');
    gameLeftScreen.userData.detailLabel='Zoom into selector';
  }
  fade.style.opacity='.13';setTimeout(()=>fade.style.opacity='0',150);
  startP.copy(camera.position);endP.copy(preset.pos);startT.copy(look);endT.copy(preset.target);
  startF=camera.fov;endF=preset.fov;t0=performance.now();dur=name==='studio'?950:1080;current=name;
  document.body.classList.remove('view-studio','view-games','view-web','view-projects','view-archive');
  document.body.classList.add('view-'+name);
  document.body.classList.toggle('focus',name!=='studio');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(name!=='studio'){
    const d=C[name];
    document.getElementById('eyebrow').textContent=d.eyebrow;
    document.getElementById('title').textContent=d.title;
    document.getElementById('copy').textContent=d.copy;
    document.getElementById('rows').innerHTML=d.rows.map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('');
  }
}

/* raycast */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let hovered=null;
let hoveredProjectCard=null;

function setProjectCardHover(card){
  if(hoveredProjectCard===card)return;
  if(hoveredProjectCard){
    const f=hoveredProjectCard.userData.hoverFrame;
    if(f?.material)f.material.opacity=0;
    hoveredProjectCard.scale.set(1,1,1);
  }
  hoveredProjectCard=card||null;
  if(hoveredProjectCard){
    const f=hoveredProjectCard.userData.hoverFrame;
    if(f?.material)f.material.opacity=.82;
    hoveredProjectCard.scale.set(1.025,1.025,1.025);
  }
}

function pointer(e){px=(e.clientX/innerWidth)*2-1;py=(e.clientY/innerHeight)*2-1;mouse.set(px,-py)}
addEventListener('pointermove',e=>{
  pointer(e);ray.setFromCamera(mouse,camera);
  let detailHit=null;
  if(current!=='studio'){
    const candidates=inspectMode==='gameSelector'?[gameLeftScreen]:detailClickables;
    detailHit=ray.intersectObjects(candidates,false).find(hit=>hit.object.userData.section===current)||null;
  }
  if(detailHit){
    const detail=detailHit.object;
    setProjectCardHover(current==='projects' && projectCardMeshes.includes(detail) ? detail : null);
    hovered=detail;document.body.style.cursor='pointer';
    tooltip.textContent=detail.userData.detailLabel||'Open project';
    tooltip.style.left=e.clientX+'px';tooltip.style.top=e.clientY+'px';tooltip.classList.add('show');
    return;
  }
  setProjectCardHover(null);
  const h=ray.intersectObjects(hotspots,false)[0]?.object||null;
  hovered=h;document.body.style.cursor=h?'pointer':'default';
  if(h){tooltip.textContent=h.userData.label;tooltip.style.left=e.clientX+'px';tooltip.style.top=e.clientY+'px';tooltip.classList.add('show')}
  else tooltip.classList.remove('show')
});
renderer.domElement.addEventListener('pointerdown',e=>{
  pointer(e);ray.setFromCamera(mouse,camera);
  if(current!=='studio'){
    const candidates=inspectMode==='gameSelector'?[gameLeftScreen]:detailClickables;
    const detailHit=ray.intersectObjects(candidates,false).find(hit=>hit.object.userData.section===current)||null;
    if(detailHit){
      const detail=detailHit.object;
      if(typeof detail.userData.onDetailClick==='function'){
        detail.userData.onDetailClick(detailHit);
        return;
      }
      const key=typeof detail.userData.getProjectKey==='function'?detail.userData.getProjectKey():detail.userData.projectKey;
      if(key)openProject(key);
      return;
    }
  }
  const h=ray.intersectObjects(hotspots,false)[0]?.object;
  if(h)setView(h.userData.view)
});

/* subtle generated room tone */
let audioCtx=null,master=null,soundOn=false;
const soundBtn=document.getElementById('sound');
function startAudio(){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();master.gain.value=0;master.connect(audioCtx.destination);
  const hum=audioCtx.createOscillator();hum.type='sine';hum.frequency.value=56;
  const hg=audioCtx.createGain();hg.gain.value=.055;hum.connect(hg).connect(master);hum.start();
  const hum2=audioCtx.createOscillator();hum2.type='triangle';hum2.frequency.value=112;
  const h2=audioCtx.createGain();h2.gain.value=.012;hum2.connect(h2).connect(master);hum2.start();
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.2;
  const src=audioCtx.createBufferSource();src.buffer=buffer;src.loop=true;
  const filt=audioCtx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=260;
  const ng=audioCtx.createGain();ng.gain.value=.018;src.connect(filt).connect(ng).connect(master);src.start()
}
soundBtn.onclick=()=>{
  if(!audioCtx)startAudio();
  soundOn=!soundOn;master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(soundOn?.035:0,audioCtx.currentTime+.22);
  soundBtn.textContent=soundOn?'Sound on':'Sound off';soundBtn.classList.toggle('on',soundOn)
};

/* animation */
const clock=new THREE.Clock();
function animate(now){
  updateLiveScreens(now);
  const dt=Math.min(clock.getDelta(),.05),t=Math.min(1,(now-t0)/dur),e=ease(t);
  camera.position.lerpVectors(startP,endP,e);look.lerpVectors(startT,endT,e);
  camera.fov=THREE.MathUtils.lerp(startF,endF,e);camera.updateProjectionMatrix();

  /* Keep the scene pixel-stable while idle.
     Pointer movement is used only for raycasting/hover, never to move the camera. */
  camera.lookAt(look);

  composer.render();requestAnimationFrame(animate)
}
requestAnimationFrame(animate);

function resize(){
  const w=innerWidth,h=innerHeight;camera.aspect=w/h;
  const preset=inspectMode?getInspectPreset(inspectMode):getPreset(current);
  camera.fov=preset.fov;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,w<760?1.05:1.55));renderer.setSize(w,h);composer.setSize(w,h);
  endP.copy(preset.pos);endT.copy(preset.target);look.copy(preset.target);
  camera.position.copy(preset.pos);camera.lookAt(preset.target);
}
addEventListener('resize',resize);
